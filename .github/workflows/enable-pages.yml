name: Enable GitHub Pages

# One-shot: legacy Pages from branch main, folder /.
# GITHUB_TOKEN with pages:write can configure the site when the app token cannot.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Set source to main /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          body='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST "$api" "${auth[@]}" -d "$body")
          echo "POST /pages -> $code"
          cat /tmp/pages.json
          echo
          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT "$api" "${auth[@]}" -d "$body")
            echo "PUT /pages -> $code"
            cat /tmp/pages.json
            echo
          fi
          case "$code" in
            200|201|204) ;;
            *) exit 1 ;;
          esac
          bcode=$(curl -sS -o /tmp/build.json -w '%{http_code}' -X POST "$api/builds" "${auth[@]}" -d '{}') || true
          echo "POST /pages/builds -> $bcode"
          cat /tmp/build.json || true
          echo
